services:
  db:
    image: postgres:17
    container_name: halsa-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - halsa_db:/var/lib/postgresql/data
    networks: [halsa]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    container_name: halsa-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HALSA_HTTP_PORT:-8000}:8000"
    volumes:
      - halsa_logs:/logs
    depends_on:
      db:
        condition: service_healthy
    networks: [halsa]

  ticker:
    image: busybox:latest
    container_name: halsa-ticker
    restart: unless-stopped
    env_file: .env
    depends_on: [web]
    networks: [halsa]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          wget -q -O /dev/null --header="Authorization: Bearer ${SCHEDULER_TOKEN}" \
            http://web:8000/scheduler/tick/ || true
          sleep 300
        done

  # Optional hidden service (install.sh enables it via COMPOSE_PROFILES).
  # The v3 key that defines the address lives in the halsa_tor volume;
  # install.sh mirrors it to ./tor-state next to this file for backups
  # (this host's docker daemon cannot bind-mount - verified 2026-11-10).
  tor:
    build: docker/tor
    container_name: halsa-tor
    restart: unless-stopped
    profiles: ["onion"]
    volumes:
      - halsa_tor:/var/lib/tor
    depends_on: [web]
    networks: [halsa]

volumes:
  halsa_db:
  halsa_logs:
  halsa_tor:

networks:
  halsa:
    driver: bridge

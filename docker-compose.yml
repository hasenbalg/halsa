services:
  db:
    image: postgres:17
    container_name: halsa-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - halsa_db:/var/lib/postgresql/data
    networks: [halsa]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    container_name: halsa-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HALSA_HTTP_PORT:-8000}:8000"
    volumes:
      - halsa_logs:/logs
    depends_on:
      db:
        condition: service_healthy
    networks: [halsa]

  ticker:
    image: busybox:latest
    container_name: halsa-ticker
    restart: unless-stopped
    env_file: .env
    depends_on: [web]
    networks: [halsa]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          wget -q -O /dev/null --header="Authorization: Bearer ${SCHEDULER_TOKEN}" \
            http://web:8000/scheduler/tick/ || true
          sleep 300
        done

volumes:
  halsa_db:
  halsa_logs:

networks:
  halsa:
    driver: bridge
